name: Release Management & Render Deployment

on:
  release:
    types: [published, created, released]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr-and-deploy:
    name: Create PR (master -> release), Auto-Merge & Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Install CLI dependencies (jq & gh)
        run: sudo apt-get update && sudo apt-get install -y jq

      # Step 1: Checkout repository with full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Ensure 'release' branch exists on remote
      - name: Initialize 'release' branch if needed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --prune

          if ! git ls-remote --heads origin release | grep -q 'refs/heads/release'; then
            echo "✨ Creating initial 'release' branch from origin/master..."
            git checkout -b release origin/master
            git push origin release
          fi

      # Step 3: Create Pull Request from master to release branch
      - name: Create Pull Request (master -> release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_BRANCH="${{ github.event.release.target_commitish || 'master' }}"
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}"

          echo "📋 Creating PR from [$SOURCE_BRANCH] -> [release] for release tag [$TAG_NAME]..."

          PR_URL=$(gh pr create \
            --base release \
            --head "$SOURCE_BRANCH" \
            --title "🚀 Release ${TAG_NAME}: Merge ${SOURCE_BRANCH} into release" \
            --body "Automated Pull Request generated by GitHub Release creation (**${TAG_NAME}**). Merging updates from \`${SOURCE_BRANCH}\` into \`release\` branch." \
            2>&1 || true)

          echo "PR Output: $PR_URL"

      # Step 4: Auto-Merge the Pull Request into 'release' branch
      - name: Auto-Merge PR into 'release' branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_BRANCH="${{ github.event.release.target_commitish || 'master' }}"
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}"

          echo "🔀 Merging PR into [release] branch..."
          
          # Try GitHub CLI auto-merge first
          gh pr merge "$SOURCE_BRANCH" --base release --merge --auto --delete-branch=false 2>/dev/null || {
            echo "Falling back to git merge..."
            git checkout release
            git pull origin release
            git merge "origin/$SOURCE_BRANCH" --no-ff -m "chore(release): Auto-merge $SOURCE_BRANCH into release for $TAG_NAME [skip ci]"
            git push origin release
          }

      # Step 5: Trigger Render Production Pipeline via Deploy Hook
      - name: Trigger Render Deploy Hook
        run: |
          echo "🔥 Invoking Render Deploy Hook..."
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      # Step 6: Monitor Render Production Deployment
      - name: Wait for Render Deployment
        id: wait_deploy
        run: |
          echo "⏳ Monitoring Render deployment status..."
          START=$(date +%s)

          for i in {1..30}
          do
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
              | jq -r '.[0].deploy.status')

            echo "Current Render Deploy Status: $STATUS"

            if [ "$STATUS" == "live" ]; then
              END=$(date +%s)
              echo "DEPLOY_TIME=$((END-START))" >> $GITHUB_ENV
              echo "✅ Render deployment is LIVE!"
              exit 0
            fi

            if [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "deploy_failed" ] || [ "$STATUS" == "canceled" ]; then
              echo "❌ Render deployment failed with status: $STATUS"
              exit 1
            fi

            sleep 20
          done

          echo "❌ Timed out waiting for Render deployment."
          exit 1

      # Step 7: Send Success Email Notification
      - name: Send Release Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: "workbench.portal@gmail.com"
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🚀 [WB_BE] Production Release ${{ github.event.release.tag_name || github.ref_name }} Deployed & Live"
          to: ${{ github.event.release.author.email || github.actor }}@gmail.com,workbench.portal@gmail.com
          from: "workbench.portal@gmail.com"
          html_body: |
            <div style="font-family: Arial, sans-serif; background:#f3f4f6; padding:30px;">
              <div style="max-width:650px; margin:auto; background:#ffffff; border-radius:10px; padding:25px; box-shadow:0 4px 6px rgba(0,0,0,0.1);">
                
                <div style="text-align:center; margin-bottom:20px;">
                  <img src="https://res.cloudinary.com/dja3u3qwa/image/upload/v1771704478/logo_new_grbbdt.png" width="150" alt="WorkBench Logo"/>
                </div>

                <h2 style="color:#16a34a; text-align:center;">🚀 Backend Production Release Live!</h2>
                <p>Hello Team,</p>
                <p>A new release PR was automatically created from <code>master</code>, merged into <strong>release</strong>, and deployed to Render Production.</p>

                <table style="width:100%; border-collapse:collapse; margin-top:15px;">
                  <tr style="border-bottom:1px solid #e5e7eb;"><td style="padding:8px;"><strong>Release Tag:</strong></td><td style="color:#2563eb; font-weight:bold;">${{ github.event.release.tag_name || github.ref_name }}</td></tr>
                  <tr style="border-bottom:1px solid #e5e7eb;"><td style="padding:8px;"><strong>Merged Branch:</strong></td><td><code>master</code> ➔ <code>release</code></td></tr>
                  <tr style="border-bottom:1px solid #e5e7eb;"><td style="padding:8px;"><strong>Status:</strong></td><td style="color:#16a34a; font-weight:bold;">LIVE ✅</td></tr>
                  <tr style="border-bottom:1px solid #e5e7eb;"><td style="padding:8px;"><strong>Deployment Time:</strong></td><td>${{ env.DEPLOY_TIME }} sec</td></tr>
                </table>

                <br/>

                <div style="text-align:center; margin-top:15px;">
                  <a href="https://wb-be-lc6x.onrender.com/health"
                     style="background:#2563eb; color:white; padding:12px 24px; text-decoration:none; border-radius:6px; font-weight:bold; display:inline-block;">
                     🌍 Verify BE Health Endpoint
                  </a>
                </div>

              </div>
            </div>

      # Step 8: Send Failure Email Notification
      - name: Send Release Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: "workbench.portal@gmail.com"
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ [WB_BE] Production Release Deployment Failed"
          to: workbench.portal@gmail.com
          from: "workbench.portal@gmail.com"
          html_body: |
            <div style="font-family: Arial, sans-serif; background:#f3f4f6; padding:30px;">
              <div style="max-width:650px; margin:auto; background:#ffffff; border-radius:10px; padding:25px;">

                <div style="text-align:center; margin-bottom:20px;">
                  <img src="https://res.cloudinary.com/dja3u3qwa/image/upload/v1771704478/logo_new_grbbdt.png" width="150" alt="WorkBench Logo"/>
                </div>

                <h2 style="color:#dc2626; text-align:center;">❌ Backend Release Deployment Failed</h2>
                <p>Hello Team,</p>
                <p>The release deployment from <code>master</code> to <strong>release</strong> encountered an issue.</p>

                <div style="text-align:center; margin-top:15px;">
                  <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                     style="background:#dc2626; color:white; padding:12px 24px; text-decoration:none; border-radius:6px; font-weight:bold; display:inline-block;">
                     🔎 Inspect GitHub Workflow Logs
                  </a>
                </div>

              </div>
            </div>
